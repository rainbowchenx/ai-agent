/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  
  /* solo-design consumption aliases: explicit prefix for fill-html-head.mjs */
  --apple-background: var(--background, #ffffff);
  --apple-foreground: var(--foreground, #0f172a);
  --apple-card: var(--card, var(--background));
  --apple-card-foreground: var(--card-foreground, var(--foreground));
  --apple-popover: var(--popover, var(--card));
  --apple-popover-foreground: var(--popover-foreground, var(--card-foreground, var(--foreground)));
  --apple-primary: var(--primary, #111827);
  --apple-primary-foreground: var(--primary-foreground, #ffffff);
  --apple-secondary: var(--secondary, var(--muted, var(--card)));
  --apple-secondary-foreground: var(--secondary-foreground, var(--foreground));
  --apple-muted: var(--muted, var(--card));
  --apple-muted-foreground: var(--muted-foreground, var(--foreground));
  --apple-accent: var(--accent, var(--secondary, var(--muted, var(--card))));
  --apple-accent-foreground: var(--accent-foreground, var(--foreground));
  --apple-destructive: var(--destructive, #ef4444);
  --apple-destructive-foreground: var(--destructive-foreground, #ffffff);
  --apple-border: var(--border, currentColor);
  --apple-input: var(--input, var(--border));
  --apple-ring: var(--ring, var(--primary));
  --apple-chart-1: var(--chart-1, var(--primary));
  --apple-chart-2: var(--chart-2, var(--secondary, var(--primary)));
  --apple-chart-3: var(--chart-3, var(--accent, var(--primary)));
  --apple-chart-4: var(--chart-4, var(--muted-foreground, var(--foreground)));
  --apple-chart-5: var(--chart-5, var(--foreground));
  --apple-sidebar: var(--sidebar, var(--background));
  --apple-sidebar-foreground: var(--sidebar-foreground, var(--foreground));
  --apple-sidebar-primary: var(--sidebar-primary, var(--primary));
  --apple-sidebar-primary-foreground: var(--sidebar-primary-foreground, var(--primary-foreground));
  --apple-sidebar-accent: var(--sidebar-accent, var(--accent, var(--muted, var(--card))));

/* ===== PRIMITIVE PALETTE ===== */

  --brand-300: #66abff;

  /* background */

  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */

  --text-200: #c7c7cc;
  --text-300: #aeaeb2;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;
  --radius-sm: 0.6rem;
  --radius-md: 1.2rem;
  --radius-lg: 1.8rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */

        font-size: 13px;
        color: var(--apple-muted-foreground);
      }

      .progress-track {
        height: 8px;
        border-radius: 999px;
        background: var(--apple-muted);
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 60%;
        border-radius: 999px;
        background: var(--apple-primary);
        transition: width 600ms ease;
      }

      /* Two-column content grid */
      .app-content {
        flex: 1;
        display: grid;
        grid-template-columns: 60% 40%;
        gap: 24px;
        padding: 8px 32px 32px;
        overflow-y: auto;
      }

      /* Shared card surface */
      .surface-card {
        background: var(--apple-card);
        color: var(--apple-card-foreground);
        border: 1px solid var(--apple-border);
        border-radius: var(--apple-radius);
        box-shadow: var(--apple-shadow-md);
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .surface-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--apple-shadow-lg);
      }

      /* Timeline column */
      .timeline-card {
        padding: 24px;
      }

      .timeline-title {
        margin: 0 0 24px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .timeline-list {
        position: relative;
        display: flex;
        flex-direction: column;
      }

      .timeline-list::before {
        content: "";
        position: absolute;
        left: 15px;
        top: 8px;
        bottom: 8px;
        width: 2px;
        background: var(--apple-border);
      }

      .timeline-step {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 16px;
        padding: 14px 0;
      }

      .step-indicator {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 999px;
        flex-shrink: 0;
        background: var(--apple-background);
        border: 2px solid var(--apple-border);
        color: var(--apple-muted-foreground);
      }

      .step-indicator.completed {
        background: var(--apple-background);
        border-color: var(--apple-primary);
        color: var(--apple-primary);
      }

      .step-indicator.running {
        background: var(--apple-primary);
        border-color: var(--apple-primary);
        color: var(--apple-primary-foreground);
      }

      .step-body {
        flex: 1;
        padding-top: 4px;
      }

      .step-name {
        font-size: 15px;
        font-weight: 600;
        color: var(--apple-foreground);
      }

      .step-meta {
        margin-top: 4px;
        font-size: 13px;
        color: var(--apple-muted-foreground);
      }

      .spinner {
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Right column cards */
      .info-column {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .info-card {
        padding: 20px;
      }

      .card-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 16px;
        font-size: 15px;
        font-weight: 600;
        color: var(--apple-foreground);
      }

      .card-title .icon {
        width: 18px;
        height: 18px;
        color: var(--apple-primary);
      }

      .info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid var(--apple-border);
      }

      .info-row:last-child {
        border-bottom: none;
      }

      .info-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--apple-muted-foreground);
      }

      .info-value {
        font-size: 14px;
        font-weight: 600;
        color: var(--apple-foreground);
      }

      /* Tool usage list */
      .tool-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .tool-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-radius: var(--apple-radius-sm);
        background: var(--apple-muted);
      }

      .tool-name {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--apple-foreground);
      }

      .tool-count {
        min-width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: var(--apple-primary);
        color: var(--apple-primary-foreground);
        font-size: 12px;
        font-weight: 700;
      }

      /* Output preview placeholder */
      .preview-frame {
        aspect-ratio: 16 / 10;
        border-radius: var(--apple-radius-sm);
        background: var(--apple-muted);
        border: 1px solid var(--apple-border);
        display: grid;
        place-items: center;
        color: var(--apple-muted-foreground);
      }

      .preview-placeholder {
        text-align: center;
      }

      .preview-placeholder .icon {
        width: 48px;
        height: 48px;
        margin-bottom: 8px;
        color: var(--apple-muted-foreground);
      }

      .preview-caption {
        font-size: 13px;
        color: var(--apple-muted-foreground);
      }

      /* Focus visibility */
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--apple-ring);
        outline-offset: 2px;
      }

      /* Responsive adjustments */
      @media (max-width: 1024px) {
        .app-content {
          grid-template-columns: 1fr;
        }
        .app-sidebar {
          width: 72px;
        }
        .sidebar-link span {
          display: none;
        }
      }
    </style>

    <div class="app-shell" data-dom-id="task-detail-shell">
      <!-- Left sidebar -->
      <aside class="app-sidebar" data-dom-id="task-sidebar" aria-label="主导航">
        <div class="sidebar-brand">
          <i data-lucide="box" style="width:22px;height:22px;"></i>
          <span>AI Agent</span>
        </div>
        <nav class="sidebar-nav">
          <a class="sidebar-link" href="#" data-dom-id="sidebar-dashboard">
            <i data-lucide="layout-dashboard" style="width:18px;height:18px;"></i>
            <span>仪表盘</span>
          </a>
          <a class="sidebar-link active" href="#" data-dom-id="sidebar-tasks" aria-current="page">
            <i data-lucide="list-checks" style="width:18px;height:18px;"></i>
            <span>任务列表</span>
          </a>
          <a class="sidebar-link" href="#" data-dom-id="sidebar-tools">
            <i data-lucide="wrench" style="width:18px;height:18px;"></i>
            <span>工具箱</span>
          </a>
          <a class="sidebar-link" href="#" data-dom-id="sidebar-history">
            <i data-lucide="history" style="width:18px;height:18px;"></i>
            <span>执行历史</span>
          </a>
          <a class="sidebar-link" href="#" data-dom-id="sidebar-settings">
            <i data-lucide="settings" style="width:18px;height:18px;"></i>
            <span>设置</span>
          </a>
        </nav>
      </aside>

      <!-- Main area -->
      <div class="app-main">
        <!-- Top header -->
        <header class="app-header" data-dom-id="task-header">
          <button class="header-back" type="button" aria-label="返回" data-dom-id="task-back-button">
            <i data-lucide="arrow-left" style="width:18px;height:18px;"></i>
          </button>
          <h1 class="header-title">生成季度销售报告</h1>
          <span class="status-badge" data-dom-id="task-status-badge">
            <span class="status-dot" aria-hidden="true"></span>
            执行中
          </span>
          <div class="header-actions">
            <button class="btn btn-secondary btn-header" type="button" data-dom-id="task-pause-button">
              <i data-lucide="pause" style="width:16px;height:16px;"></i>
              暂停
            </button>
            <button class="btn btn-danger btn-header" type="button" data-dom-id="task-cancel-button">
              <i data-lucide="x" style="width:16px;height:16px;"></i>
              取消
            </button>
            <button class="btn btn-primary btn-header" type="button" data-dom-id="task-rerun-button">
              <i data-lucide="refresh-cw" style="width:16px;height:16px;"></i>
              重新运行
            </button>
          </div>
        </header>

        <!-- Overall progress -->
        <section class="app-progress" data-dom-id="task-progress" aria-label="总体进度">
          <div class="progress-meta">
            <span>总体进度</span>
            <span>60%</span>
          </div>
          <div class="progress-track" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-fill" style="width: 60%;"></div>
          </div>
        </section>

        <!-- Two-column content -->
        <main class="app-content">
          <!-- Left: execution timeline -->
          <section class="surface-card timeline-card" data-dom-id="task-timeline" aria-label="执行步骤">
            <h2 class="timeline-title">执行步骤</h2>
            <div class="timeline-list">
              <div class="timeline-step" data-dom-id="step-1">
                <span class="step-indicator completed" aria-hidden="true">
                  <i data-lucide="check" style="width:16px;height:16px;"></i>
                </span>
                <div class="step-body">
                  <div class="step-name">分析数据源</div>
                  <div class="step-meta">已完成 · 耗时 12 秒</div>
                </div>
              </div>
              <div class="timeline-step" data-dom-id="step-2">
                <span class="step-indicator completed" aria-hidden="true">
                  <i data-lucide="check" style="width:16px;height:16px;"></i>
                </span>
                <div class="step-body">
                  <div class="step-name">调用网页搜索工具</div>
                  <div class="step-meta">已完成 · 调用 3 次</div>
                </div>
              </div>
              <div class="timeline-step" data-dom-id="step-3">
                <span class="step-indicator running" aria-hidden="true">
                  <i data-lucide="loader-2" class="spinner" style="width:16px;height:16px;"></i>
                </span>
                <div class="step-body">
                  <div class="step-name">整理数据表格</div>
                  <div class="step-meta">正在执行 · 预计剩余 18 秒</div>
                </div>
              </div>
              <div class="timeline-step" data-dom-id="step-4">
                <span class="step-indicator" aria-hidden="true">
                  <i data-lucide="circle" style="width:14px;height:14px;"></i>
                </span>
                <div class="step-body">
                  <div class="step-name">生成可视化图表</div>
                  <div class="step-meta">等待中</div>
                </div>
              </div>
              <div class="timeline-step" data-dom-id="step-5">
                <span class="step-indicator" aria-hidden="true">
                  <i data-lucide="circle" style="width:14px;height:14px;"></i>
                </span>
                <div class="step-body">
                  <div class="step-name">撰写总结</div>
                  <div class="step-meta">等待中</div>
                </div>
              </div>
            </div>
          </section>

          <!-- Right: info, tools, output -->
          <aside class="info-column">
            <!-- Task info card -->
            <article class="surface-card info-card" data-dom-id="task-info-card">
              <h2 class="card-title">
                <i data-lucide="info" class="icon"></i>
                任务信息
              </h2>
              <div class="info-row">
                <span class="info-label">
                  <i data-lucide="calendar" style="width:16px;height:16px;"></i>
                  创建时间
                </span>
                <span class="info-value">2026-09-05 09:42</span>
              </div>
              <div class="info-row">
                <span class="info-label">
                  <i data-lucide="clock" style="width:16px;height:16px;"></i>
                  预计耗时
                </span>
                <span class="info-value">约 2 分钟</span>
              </div>
              <div class="info-row">
                <span class="info-label">
                  <i data-lucide="flag" style="width:16px;height:16px;"></i>
                  优先级
                </span>
                <span class="info-value">高</span>
              </div>
            </article>

            <!-- Tool usage card -->
            <article class="surface-card info-card" data-dom-id="task-tools-card">
              <h2 class="card-title">
                <i data-lucide="wrench" class="icon"></i>
                工具调用
              </h2>
              <div class="tool-list">
                <div class="tool-item" data-dom-id="tool-web-search">
                  <span class="tool-name">
                    <i data-lucide="globe" style="width:16px;height:16px;"></i>
                    网页搜索
                  </span>
                  <span class="tool-count">3</span>
                </div>
                <div class="tool-item" data-dom-id="tool-data-parser">
                  <span class="tool-name">
                    <i data-lucide="file-spreadsheet" style="width:16px;height:16px;"></i>
                    表格解析
                  </span>
                  <span class="tool-count">2</span>
                </div>
                <div class="tool-item" data-dom-id="tool-chart-gen">
                  <span class="tool-name">
                    <i data-lucide="bar-chart-3" style="width:16px;height:16px;"></i>
                    图表生成
                  </span>
                  <span class="tool-count">0</span>
                </div>
                <div class="tool-item" data-dom-id="tool-llm">
                  <span class="tool-name">
                    <i data-lucide="message-square" style="width:16px;height:16px;"></i>
                    文本生成
                  </span>
                  <span class="tool-count">0</span>
                </div>
              </div>
            </article>

            <!-- Output preview card -->
            <article class="surface-card info-card" data-dom-id="task-output-card">
              <h2 class="card-title">
                <i data-lucide="image" class="icon"></i>
                输出预览
              </h2>
              <div class="preview-frame" data-dom-id="output-preview-frame">
                <div class="preview-placeholder">
                  <i data-lucide="bar-chart-3" class="icon"></i>
                  <div class="preview-caption">图表生成后在此处预览</div>
                </div>
              </div>
            </article>
          </aside>
        </main>
      </div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
